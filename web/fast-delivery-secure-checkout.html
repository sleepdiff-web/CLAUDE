<style>
.lumi-fdsc,.lumi-fdsc *{box-sizing:border-box !important;margin:0 !important;padding:0 !important;border:0 !important;
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif !important;
  -webkit-font-smoothing:antialiased !important;}
.lumi-fdsc{width:100% !important;margin:6px 0 0 !important;text-align:center !important;}

/* --- Fast Delivery • Secure Checkout row --- */
.lumi-fdsc .fd-row{display:flex !important;align-items:center !important;justify-content:center !important;
  gap:10px !important;flex-wrap:nowrap !important;}
.lumi-fdsc .fd-item{display:inline-flex !important;align-items:center !important;gap:7px !important;
  font-size:15px !important;font-weight:600 !important;color:#111111 !important;white-space:nowrap !important;}
.lumi-fdsc .fd-item svg{display:block !important;width:19px !important;height:19px !important;flex-shrink:0 !important;}
.lumi-fdsc .fd-sep{width:4px !important;height:4px !important;border-radius:50% !important;
  background:#c2c2c8 !important;flex-shrink:0 !important;}

/* --- payment icons row --- */
.lumi-fdsc .fd-pays{display:flex !important;align-items:center !important;justify-content:center !important;
  flex-wrap:wrap !important;gap:5px !important;margin:12px 0 0 !important;list-style:none !important;}
.lumi-fdsc .fd-pays li{display:block !important;line-height:0 !important;}
.lumi-fdsc .fd-pays svg{display:block !important;width:38px !important;height:24px !important;border-radius:3px !important;}

@media (max-width:749px){
  .lumi-fdsc{margin:5px 0 0 !important;}
  .lumi-fdsc .fd-item{font-size:13.5px !important;gap:6px !important;}
  .lumi-fdsc .fd-item svg{width:17px !important;height:17px !important;}
  .lumi-fdsc .fd-pays svg{width:34px !important;height:21px !important;}
}
</style>
